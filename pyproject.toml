[project]
name = "geometric-canaries"
version = "0.1.0"
description = "Streaming geometric canaries and KV-cache rollback for Lean proof generation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0,<2",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "torch==2.7.1",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.46,<0.50",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff.lint]
ignore = [
    "BLE001", # Allow broad exceptions for tokenizer fallback
    "DTZ005", # Allow timezone-naive local timestamps for result filenames
]

[tool.pyright]
# rollback/*.py is run as a script, so sys.path[0] is rollback/ at runtime;
# mirror that here so flat imports (e.g. `from lean import ...`) resolve.
extraPaths = ["rollback"]
