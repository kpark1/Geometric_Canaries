name = "canaries"
# Bare `lake build` builds only defaultTargets, so it can't pull in Solution
# (the model's untrusted proof) by accident.
defaultTargets = ["Challenge"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# Challenge.lean / Solution.lean are written per-check by rollback/comparator.py
# and are gitignored. Comparator builds both as real lake targets to compare
# their declarations, rather than the ad hoc scratch-file `lake env lean` path
# used by rollback/lean.py's cheaper stage-1 check.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
